name: Verify app and published data
on:
  push:
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - 'README.md'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: npm ci
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/refresh_data.py --validate-only
      - run: python scripts/refresh_monthly.py --validate-only
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: npm test
      - run: npm run build
